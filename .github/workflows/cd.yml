
name: Deploy to EC2

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to deploy"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ec2-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Docker application
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Validate image tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if ! [[ "$IMAGE_TAG" =~ ^[a-f0-9]{40}$ ]]; then
            echo "Error: image_tag must be a 40-character Git SHA."
            exit 1
          fi

      - name: Deploy to EC2 over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 30s
          command_timeout: 5m
          script: |
            set -eu

            IMAGE="vishnumajji/cicd_app:${{ inputs.image_tag }}"

            echo "Pulling image: $IMAGE"
            sudo docker pull "$IMAGE"

            echo "Starting new container"
            sudo docker rm -f cicd_app 2>/dev/null || true

            sudo docker run -d \
              --name cicd_app \
              --restart unless-stopped \
              -p 5000:5000 \
              "$IMAGE"

            echo "Checking application health"
            for i in $(seq 1 15); do
              if curl --fail --silent http://localhost:5000; then
                echo
                echo "Deployment successful!"
                exit 0
              fi
              sleep 2
            done

            echo "Health check failed"
            sudo docker logs --tail 100 cicd_app || true
            exit 1

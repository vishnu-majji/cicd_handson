
name: Deploy to EC2

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Git commit SHA tag of the image to deploy"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy application to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -eu

            IMAGE="vishnumajji/cicd_app:${{ inputs.image_tag }}"

            sudo docker pull "$IMAGE"

            sudo docker rm -f cicd_app 2>/dev/null || true

            sudo docker run -d \
              --name cicd_app \
              --restart unless-stopped \
              -p 5000:5000 \
              "$IMAGE"

            sleep 3
            sudo docker ps --filter name=cicd_app

            curl --fail --retry 5 --retry-delay 2 \
              http://localhost:5000

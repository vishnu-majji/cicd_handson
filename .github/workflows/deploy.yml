name: Deploy to EC2

on:
  workflow_run:
    workflows: ["CI"] # Change this to match the exact name of your CI workflow file/header
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy application to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker pull vishnumajji/cicd_app:${{ github.event.workflow_run.head_sha }}
            sudo docker rm -f cicd_app 2>/dev/null || true
            sudo docker run -d --name cicd_app --restart unless-stopped -p 5000:5000 vishnumajji/cicd_app:${{ github.event.workflow_run.head_sha }}
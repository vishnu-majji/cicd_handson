name: CI pipeline


on:
  push:
     Branches:
       -main

  pull_request:
    branches:
     -main
jobs:
  test:
   runs-on: ubuntu-latest

   steps:
    - name: checkout code
      uses: actions/checkout@v4
      
    - name: setup python
      uses: actions/setup-python@v5
      with: 
         python-version: "3.12"

    - name: install dependencies
      run: pip install -r requirements.txt

    - name: run tests
      run: pytest

    - name: Build docker image
      run: docker build -t cicd_handson:${{github.sha}} .

    - name: login to docker hub
      uses: docker/login-action@v3
      with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
    - name: build docker image
      run: docker build -t vishnumajji/cicd_app:${{github.sha}} .
    
    - name: push docker image
      run: docker push vishnumajji/cicd_app:${{github.sha}}
